services:
  - type: web
    name: waste-detection-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Set manually in the Render dashboard to your Supabase connection-pooler
      # string (see .env locally for the format) — Render no longer provisions
      # its own Postgres for this project.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: uploads
    disk:
      name: uploads-disk
      mountPath: /app/uploads
      sizeGB: 1
