services:
  - type: web
    name: waste-detection-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: waste-detection-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: uploads
    disk:
      name: uploads-disk
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: waste-detection-db
    plan: free
    postgresMajorVersion: 16
